<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>James Adams | WDD 130</title>
  <meta name="description" content="JamesAdams WDD130 SchoolWork: Forms">
  <meta name="author" content="JamesAdams">
  <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>

  <header></header>
  <main>
    <form action="">
      <fieldset> fadsf</fieldset>
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" required>
      <label for="useremail">Email:</label>
      <input type="email" id="useremail" name="useremail" required>
      <label for="browser">What is your favorite browser?</label>
      <select name="browser" id="browser">
        <option value="1">Chrome</option>
        <option value="2">Safari</option>
        <option value="3">Edge</option>
        <option value="4">Brave</option>
        <option value="5">Other</option>

      </select>
      <label for="pet">Do you have a household pet? <input type="checkbox" id="pet"
          name="pet"></label>
      <label for="feedback">List the places you have lived. <textarea id="feedback" name="feedback"
          rows="4" placeholder="Shows example text inside an input field"></textarea></label>
      <button type="submit">Submit Poll</button>

    </form>
  </main>
  <footer></footer>
</body>

</html>
