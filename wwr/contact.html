<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Cold Rush Rapids</title>
  <meta name="description"
    content="Whitewater rafting, travel scheduling opportunity, our contact information and scheduling form.">
  <meta name="author" content="James Adams">
  <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
  <header class="header">
    <img src="images/downriver.png" alt="Drawing of inner tubes floating down a river" width="200">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>
  <main>
    <section class="contact">
      <h1>Cold Rush Rapids</h1>
      <div class="hero">

        <h3> 123 address river lane</h3>
        <h3>town, state</h3>
        <h3>1 999 999 9999</h3>
        <h3>info@coldrushrapids.com</h3>
      </div>
    </section>
    <section class="contact-form">

      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15907.875223498055!2d-77.87066470253123!3d-4.599610475999972!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91c98b15273cd6ab%3A0xe76a1abce3d02469!2sSanta%20Mar%C3%ADa%20de%20Nieva%2C%20Peru!5e0!3m2!1sen!2sus!4v1785744354425!5m2!1sen!2sus"
        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <form>
        <div class="text-input">
          <Label for="name">Name </Label>
          <input type="text" id="name" name="name">
        </div>

        <div class="text-input">
          <label for="email">Email </label>
          <input type="email" id="email" name="email">
        </div>

        <div class="radio">
          <p>Message Purpose</p>
          <div class="radio-buttons">
            <label><input type="radio" id="inquiry" name="purpose">General Inquiry</label>
            <label><input type="radio" id="question" name="purpose">Reservation Question</label>
            <label><input type="radio" id="suggestion" name="purpose">Website Suggestion</label>
          </div>
        </div>

        <div>
          <legend><label for="message">Message</label></legend>
          <textarea name="message" id="message" rows="4"></textarea>
        </div>

        <div>
          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">Please subscribe me to the monthly newsletter</label>
        </div>
        <div>
          <button type="submit">Reach out now</button>
        </div>
      </form>

    </section>
    <section class="employee-profiles">
      <h2>We are here to serve you</h2>
      <figure>
        <img src="images/guide (1).jpg" alt="Tour guide">
        <figcaption>River guide</figcaption>
      </figure>
      <figure>
        <img src="images/compliance officer (1).jpg" alt="safty specialist">
        <figcaption>Safety officer</figcaption>
      </figure>
      <figure>
        <img src="images/Instructor2 (1).jpg" alt="educator">
        <figcaption>Instructor</figcaption>
      </figure>
    </section>
  </main>
  <footer class="footer">
    <p>© 2026 Cold Rush Rapids James Adams</p>
    <nav class="socialmedia">
      <a href="https://www.facebook.com/">
        <img src="images/facebook-square.svg" alt="Facebook Icon" width="30">
      </a>
      <a href="https://x.com/">
        <img src="images/x-bw.svg" alt="X.com Icon" width="30">
      </a>
      <a href="https://www.youtube.com/">
        <img src="images/youtube-square.svg" alt="Youtube Icon" width="30">
      </a>
    </nav>
  </footer>
</body>

</html>
